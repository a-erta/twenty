name: Build AMG branded image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/branding.yml']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AMG favicon
        run: curl -fsSL "https://amgboatxp.com/wp-content/uploads/2024/02/Favicon.jpg" -o /tmp/favicon.jpg

      - name: Generate icon set (all sizes, same filenames)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          SRC=packages/twenty-front/public/images/icons
          OUT=branding/icons
          find "$SRC" -name '*.png' | while read -r f; do
            rel="${f#"$SRC"/}"
            size=$(identify -format '%wx%h' "$f")
            mkdir -p "$OUT/$(dirname "$rel")"
            convert /tmp/favicon.jpg -resize "${size}^" -gravity center -extent "$size" "$OUT/$rel"
          done
          echo "Generated: $(find "$OUT" -type f | wc -l) icons"

      - name: Create Dockerfile
        run: |
          cat > branding/Dockerfile <<'EOF'
          FROM twentycrm/twenty:latest
          COPY icons/ /app/packages/twenty-server/dist/front/images/icons/
          EOF

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/twenty-amg:latest branding/
          docker push ghcr.io/${{ github.repository_owner }}/twenty-amg:latest
